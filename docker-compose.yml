services:
  integrityhvac:
    build: .
    container_name: integrityhvac-crm
    ports:
      - "8677:8677"
    env_file:
      - ./server/.env.production
    environment:
      - PORT=8677
      - NODE_ENV=production
    volumes:
      # Persist the leads data using named volume (better permissions handling)
      - integrityhvac-data:/app/data
    restart: unless-stopped

volumes:
  integrityhvac-data:
